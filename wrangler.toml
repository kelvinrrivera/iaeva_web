name = "iaeva-landing"
main = "dist/index.html"

[site]
bucket = "./dist"

[build]
command = "npm run build"


# Pages configuration
pages_build_output_dir = "dist"

[env.production]
routes = [
  { pattern = "iaeva.com", custom_domain = true }
]

# Deployment commands:
# npx wrangler pages deploy dist
# npx vite --force
# npm run clean