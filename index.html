      Metadatos por defecto: solo se usan mientras Helmet no los sustituya.

      `data-rh="true"` marca cada etiqueta como gestionada por react-helmet-async. Sin esa
      marca, Helmet **añade** las suyas en vez de reemplazar estas, y el HTML acababa con
      dos `meta description`: Google lee la primera, que era la genérica de la home. Por
      eso las 27 páginas mostraban la misma descripción aunque cada una definiera la suya.
    -->

    <!-- Script para asegurar que React esté cargado primero -->
    <script>
      // Definir React globalmente para asegurar que está accesible para todos los módulos
      window.React = window.React || {};
      
      // Función de orden prioritario para carga de scripts
      function prioritizeReactLoading() {
        // Buscar y ordenar scripts para que el vendor de React cargue primero
        const scripts = Array.from(document.querySelectorAll('script[src*=".js"]'));
        
        // Función para determinar prioridad de carga
        const getPriority = (src) => {
          if (src.includes('vendor-react')) return 1;
          if (src.includes('vendor-router') || src.includes('vendor-i18n') || src.includes('vendor-ui')) return 2;
          if (src.includes('vendor')) return 3;
          return 9;
        };
        
        // Ordenar scripts por prioridad
        scripts.sort((a, b) => {
          const srcA = a.getAttribute('src') || '';
          const srcB = b.getAttribute('src') || '';
          return getPriority(srcA) - getPriority(srcB);
        });
        
        // Aplicar prioridad y modificar atributos
        scripts.forEach((script, index) => {
          const src = script.getAttribute('src') || '';
          
          // Alta prioridad para React
          if (getPriority(src) <= 3) {
            script.setAttribute('fetchpriority', 'high');
            
            // Solo para scripts críticos de React
            if (getPriority(src) === 1) {
              script.setAttribute('importance', 'high');
              // Clonar y reemplazar para garantizar la carga al inicio
              const clone = script.cloneNode(true);
              document.head.insertBefore(clone, document.head.firstChild);
              // Eliminar el original si existe
              if (script.parentNode) {
                script.parentNode.removeChild(script);
              }
            }
          }
        });
      }
      
      // Ejecutar inmediatamente y nuevamente al cargar
      prioritizeReactLoading();
      window.addEventListener('DOMContentLoaded', prioritizeReactLoading);
    </script>
