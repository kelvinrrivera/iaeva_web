faq:
  - question: "¿Qué es IAEVA?"
    answer: "IAEVA es un asistente virtual inteligente especializado en el sector sanitario que optimiza agendas médicas, reduce ausencias de pacientes y mejora la eficiencia operativa en hospitales y clínicas."
  
  - question: "¿Cómo reduce IAEVA las ausencias de pacientes?"
    answer: "IAEVA utiliza algoritmos predictivos para identificar patrones de ausencias, envía recordatorios personalizados por múltiples canales, y ofrece reprogramación instantánea cuando detecta posibles cancelaciones."
  
  - question: "¿Es compatible con otros sistemas de gestión hospitalaria?"
    answer: "Sí, IAEVA se integra con la mayoría de sistemas EMR, HMS y software de gestión de citas médicas a través de APIs seguras y conectores personalizados."
  
  - question: "¿Qué idiomas soporta IAEVA?"
    answer: "Actualmente IAEVA está disponible en español y francés, con planes de expansión a inglés, portugués y otros idiomas próximamente."
  
  - question: "¿Cuánto tiempo lleva implementar IAEVA en mi centro médico?"
    answer: "El tiempo promedio de implementación es de 2-4 meses, dependiendo de la complejidad de los sistemas existentes y la personalización requerida."

