website: "IAEVA - Inteligencia Artificial para Optimización Sanitaria"
url: https://iaeva.com
description: |
  IAEVA ofrece soluciones de inteligencia artificial especializadas para el sector sanitario, 
  con foco en optimización de agendas médicas, reducción de ausencias de pacientes y 
  mejora de la eficiencia clínica en hospitales y centros de salud.

