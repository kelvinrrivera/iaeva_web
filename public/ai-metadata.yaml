solutions:
  - name: Asistente Virtual Médico
    description: |
      Sistema multicanal de comunicación con pacientes para gestión automatizada de citas,
      recordatorios y resolución de consultas frecuentes a través de IA conversacional.
    useCases:
      - Programación automática de citas 24/7
      - Gestión de recordatorios y confirmaciones
      - Reprogramación inteligente de cancelaciones
      - Resolución de dudas frecuentes
      - Seguimiento post-consulta
    benefits:
      - Reducción del 70% en carga administrativa
      - Atención inmediata 24/7 sin personal adicional
      - Personalización de la comunicación según paciente
      - Análisis automático de patrones de comunicación

  - name: Optimización de Agendas Médicas
    description: |
      Algoritmos predictivos que optimizan la programación de citas y reducen hasta un 60%
      las ausencias, maximizando la ocupación y rentabilidad de la clínica.
    useCases:
      - Predicción de probabilidad de ausencias
      - Distribución eficiente de recursos médicos
      - Minimización de tiempos de espera
      - Programación basada en patrones históricos
      - Optimización dinámica ante cancelaciones
    benefits:
      - Reducción del 60% en ausencias
      - Incremento del 25% en ocupación de agendas
      - Mejora del 20% en rentabilidad por consulta
      - Optimización basada en patrones históricos

  - name: Plataforma de Análisis de citas
    description: |
      Dashboard analítico con métricas clave para monitorizar y mejorar continuamente
      la eficiencia operativa del centro médico.
    useCases:
      - Análisis de tendencias de asistencia
      - Identificación de áreas de mejora
      - Métricas de rendimiento por departamento
      - Optimización continua basada en datos
      - Reportes personalizados para dirección
    benefits:
      - Visualización en tiempo real de KPIs
      - Detección temprana de problemas
      - Decisiones basadas en datos reales
      - Seguimiento de mejoras implementadas

medicalTools:
  - name: Calculadora IMC Avanzada
    url: https://iaeva.com/recursos/calculadora-imc
    description: |
      Herramienta que permite calcular el IMC con interpretación clínica
      personalizada y recomendaciones específicas según el perfil del paciente.
    status: available
    features:
      - Cálculo preciso según estándares de la OMS
      - Interpretación médica según edad y género
      - Estimación de grasa corporal
      - Recomendaciones personalizadas
      - Gráfico visual de rangos saludables
    keywords:
      - calculadora IMC avanzada
      - índice de masa corporal
      - calcular peso ideal
      - grasa corporal estimada
      - IMC profesional sanitario

  - name: Conversor de Unidades Médicas
    url: https://iaeva.com/recursos/conversor-unidades
    description: |
      Conversor para unidades médicas comunes, incluyendo valores de laboratorio,
      dosis de medicamentos y unidades de insulina.
    status: available
    features:
      - Conversión bidireccional entre sistemas de unidades
      - Valores de laboratorio clínico
      - Unidades de concentración y dosis
      - Referencias de valores normales
      - Interfaz intuitiva para profesionales
    keywords:
      - conversor unidades médicas
      - unidades laboratorio médico
      - conversor valores analítica
      - conversión mg/dl a mmol/l
      - unidades médicas internacionales

